name: Auto Telegram Proxy Checker (No DB)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # این دسترسی برای پوش کردن فایل ضروریه
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Proxy Checker
        run: python main.py

      - name: Commit and Push proxies.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add proxies.json
          git commit -m "🔄 Auto-update proxies.json" || exit 0
          git push
